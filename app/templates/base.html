<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}JADLOG BRÁS{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <meta
        name="theme-color"
        content="#E31E24"
    >

    <style>
        :root {
            --jadlog-red: #E31E24;
            --jadlog-red-dark: #B81217;
            --background: #F8F9FA;
            --text-dark: #212529;
        }

        * {
            font-family: "Inter", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--background);
            color: var(--text-dark);
        }

        .navbar-jadlog {
            background: var(--jadlog-red);
            box-shadow: 0 2px 18px rgba(227, 30, 36, 0.25);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
        }

        .navbar-brand img {
            display: block;
            max-width: 155px;
            max-height: 52px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 10px;
            padding: 6px 10px;
        }

        .navbar-jadlog .nav-link {
            color: rgba(255, 255, 255, 0.92);
            font-weight: 600;
        }

        .navbar-jadlog .nav-link:hover,
        .navbar-jadlog .nav-link.active {
            color: #ffffff;
        }

        .main-content {
            width: min(1180px, 94%);
            margin: 0 auto;
            padding: 28px 0 50px;
        }

        .footer-jadlog {
            margin-top: 40px;
            padding: 22px;
            background: #212529;
            color: #ffffff;
            text-align: center;
            font-size: 14px;
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-jadlog sticky-top">
        <div class="container">

            <a class="navbar-brand" href="/">
                <img
                    src="/static/logo-jadlog.png"
                    alt="Jadlog Brás"
                >
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="menuPrincipal"
            >
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/simulador/">
                            Simulador
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/consulta/">
                            Consulta
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-jadlog">
        &copy; 2026 JADLOG BRÁS — Todos os direitos reservados
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="/static/js/main.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("/sw.js")
                    .catch((error) => {
                        console.error(
                            "Erro ao registrar Service Worker:",
                            error
                        );
                    });
            });
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
