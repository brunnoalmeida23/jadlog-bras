<!-- app/templates/rastreio.html -->
{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">
        <i class="bi bi-truck text-danger me-2"></i>Rastreie sua Encomenda
    </h2>

    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card-shadow">
                <form id="formRastreio">
                    <div class="mb-3">
                        <label class="fw-bold">
                            <i class="bi bi-upc-scan me-1"></i>
                            Código de Rastreio
                        </label>
                        <div class="input-group">
                            <input type="text" class="form-control form-control-lg" id="codigoRastreio" 
                                   placeholder="Digite o código de rastreio" required>
                            <button type="submit" class="btn btn-jadlog" id="btnBuscar">
                                <i class="bi bi-search me-2"></i>Buscar
                            </button>
                        </div>
                        <small class="text-muted">Ex: 18137200312411</small>
                    </div>
                </form>

                <div id="resultadoArea" style="display:none;" class="mt-4">
                    <hr>
                    <div id="statusAtual" class="alert alert-info"></div>
                    <div id="historico"></div>
                </div>

                <div id="erroArea" style="display:none;" class="alert alert-danger mt-3"></div>
                <div id="loadingArea" style="display:none;" class="text-center py-4">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-2 text-muted">Buscando informações do rastreio...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .timeline-item {
        border-left: 3px solid #E31E24;
        padding-left: 20px;
        padding-bottom: 20px;
        position: relative;
    }
    .timeline-item::before {
        content: "●";
        color: #E31E24;
        font-size: 20px;
        position: absolute;
        left: -10px;
        top: 0;
    }
    .timeline-item:last-child {
        border-left-color: #28a745;
    }
    .timeline-item:last-child::before {
        color: #28a745;
    }
</style>

<script>
document.getElementById('formRastreio').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const codigo = document.getElementById('codigoRastreio').value.trim();
    if (!codigo) {
        alert('Digite o código de rastreio');
        return;
    }
    
    const btn = document.getElementById('btnBuscar');
    const resultadoArea = document.getElementById('resultadoArea');
    const erroArea = document.getElementById('erroArea');
    const loadingArea = document.getElementById('loadingArea');
    const statusAtual = document.getElementById('statusAtual');
    const historico = document.getElementById('historico');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Buscando...';
    resultadoArea.style.display = 'none';
    erroArea.style.display = 'none';
    loadingArea.style.display = 'block';
    
    try {
        const formData = new URLSearchParams();
        formData.append('codigo', codigo);
        
        const response = await fetch('/rastreio/buscar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData
        });
        
        const result = await response.json();
        loadingArea.style.display = 'none';
        
        if (result.success) {
            resultadoArea.style.display = 'block';
            
            // Status atual
            statusAtual.className = 'alert ' + (result.status === 'Entregue' ? 'alert-success' : 'alert-info');
            statusAtual.innerHTML = `
                <strong>Status atual:</strong> ${result.status}
                <br>
                <small>Código: ${result.codigo}</small>
            `;
            
            // Histórico
            let html = '<h5 class="mt-3">Histórico de eventos</h5>';
            if (result.historico && result.historico.length > 0) {
                result.historico.forEach(item => {
                    html += `
                        <div class="timeline-item">
                            <strong>${item.data}</strong> ${item.hora ? '- ' + item.hora : ''}
                            <br>
                            <span>${item.status}</span>
                            ${item.local ? `<br><small class="text-muted">📍 ${item.local}</small>` : ''}
                        </div>
                    `;
                });
            } else {
                html += '<p class="text-muted">Nenhum evento encontrado</p>';
            }
            historico.innerHTML = html;
            
        } else {
            erroArea.style.display = 'block';
            erroArea.textContent = '❌ ' + (result.message || 'Código não encontrado');
        }
    } catch (error) {
        loadingArea.style.display = 'none';
        erroArea.style.display = 'block';
        erroArea.textContent = '❌ Erro ao buscar rastreio. Tente novamente.';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-search me-2"></i> Buscar';
    }
});
</script>
{% endblock %}
